name: build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布正式 Release 的 tag（如 v1.2）。留空则只构建、不发 Release。'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 35 + build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Build APK
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x build.sh
          ./build.sh

      - name: Core regression test (JVM, synthetic APK)
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x jvmtest/run_test.sh
          ./jvmtest/run_test.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaeaDarkTool-apk
          path: out/ArcaeaDarkTool.apk
          if-no-files-found: error

  # ---- rolling pre-release, refreshed on every push to main ------------------
  release-latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ArcaeaDarkTool-apk
          path: dist

      - name: Refresh rolling "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          make_latest: 'false'
          files: dist/ArcaeaDarkTool.apk
          fail_on_unmatched_files: true
          body: |
            自动构建：main 分支最新提交 ${{ github.sha }}

            这是每次 push 到 main 都会刷新的滚动预览版，供直接下载测试。
            稳定的正式版请看带版本号的 Release（例如 v1.1）。
            与上游同一把公共签名密钥，可与原版共存、覆盖升级不丢存档。

  # ---- versioned release on v* tag (or manual dispatch with release_tag) -----
  release-versioned:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ArcaeaDarkTool-apk
          path: dist

      - name: Show downloaded files
        run: ls -la dist

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Arcaea 全暗改包 ${{ env.RELEASE_TAG }}
          prerelease: false
          make_latest: 'true'
          files: dist/ArcaeaDarkTool.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Android 本地版 Arcaea 全暗改包工具（手动导入 APK，无 adb）。

            - 直接下载下方 ArcaeaDarkTool.apk 安装（minSdk 26 / target 35）
            - 与上游同一把公共签名密钥，可与原版共存、覆盖升级不丢存档
            - 详细说明见仓库 README
