name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 35 + build-tools 35.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Build APK
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x build.sh
          ./build.sh

      - name: Core regression test (JVM, synthetic APK)
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          chmod +x jvmtest/run_test.sh
          ./jvmtest/run_test.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcaeaDarkTool-apk
          path: out/ArcaeaDarkTool.apk
          if-no-files-found: error
